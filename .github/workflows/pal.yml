name: pal

on:
  push:
    branches: [main]
    paths:
      - 'packages/launcher/**'
      - 'apps/pal-electron/**'
      - 'scripts/pal/**'
      - '.github/workflows/pal.yml'
  pull_request:
    paths:
      - 'packages/launcher/**'
      - 'apps/pal-electron/**'
      - 'scripts/pal/**'
      - '.github/workflows/pal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 类型检查 + 全量测试（含 PAL 内核）
        run: pnpm check

      - name: 打包 launcher（esbuild，单文件）
        run: pnpm pal:bundle

      - name: 端到端冒烟（起服务 → 建 → 体检 → 删）
        run: pnpm pal:smoke

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Windows 全量测试（路径、垫片、权限位）
        run: pnpm check

      - name: Windows 端到端冒烟
        run: pnpm pal:smoke
