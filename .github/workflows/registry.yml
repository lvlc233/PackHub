name: registry

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 锁文件完整性（每条 resolution 都要带 integrity）
        run: pnpm verify:lockfile

      - name: 内核测试
        run: pnpm check

      - name: 文档体检（分类 · 保质期 · 链接 · 占位标记）
        run: pnpm docs:audit

      - name: 计划与安装性能（200 资源）
        run: |
          pnpm bench:check
          pnpm bench:install

      - name: 依赖漏洞审计（high 及以上阻断）
        run: pnpm audit --audit-level high

      - name: registry 校验（schema · pin · 锁一致性 · 版本不可变）
        run: pnpm registry:check

      - name: 真装一遍并校验（干净环境，需要联网取资源）
        run: pnpm registry:verify-all

      - name: 示例包安装 + verify 矩阵
        run: pnpm verify:examples

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Windows 全量测试（路径、权限位、命令垫片）
        run: pnpm check
