name: registry

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 内核测试
        run: pnpm check

      - name: 计划与安装性能（200 资源）
        run: |
          pnpm bench:check
          pnpm bench:install

      - name: 依赖漏洞审计（high 及以上阻断）
        run: pnpm audit --audit-level high

      - name: registry 校验（schema · pin · 锁一致性 · 版本不可变）
        run: pnpm registry:check

      - name: 真装一遍并校验（干净环境，需要联网取资源）
        run: pnpm registry:verify-all

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Windows 全量测试（路径、权限位、命令垫片）
        run: pnpm check

  publish-index:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 生成 index.json
        run: pnpm registry:index

      - name: 准备站点产物（索引 + 归档，归档路径与 index 里的约定一致）
        run: |
          mkdir -p site
          cp registry/index.json site/index.json
          (cd registry && find packs -type f -name '*.phub' -exec cp --parents {} ../site/ \;)
          echo "PackHub registry" > site/README.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
