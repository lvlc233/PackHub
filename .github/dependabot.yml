version: 2
# 依赖更新交给机器人开 PR：actions 钉的是 commit SHA，不靠人记得回来改
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    open-pull-requests-limit: 5
