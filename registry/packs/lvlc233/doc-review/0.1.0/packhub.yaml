apiVersion: packhub.dev/v0
kind: Pack

metadata:
  name: lvlc233/doc-review
  version: 0.1.0
  title: 文档验收：先机械检查，再冷读
  description: 文档写完后先跑结构、链接和 Markdown 格式检查，再让独立读者按“目的内是否答得出、路径是否走得通”做一次冷读，最后只修阻断项。
  license: MIT
  targets: [dir, dsh, claude-code]
  visibility: public
  keywords: [documentation, review, markdown, cold-read]

requires:
  packhub: ">=0.0.1 <0.1"

slots:
  lint:
    contract: [doc:lint]
    note: 格式检查实现；当前绑定 markdownlint MCP，换实现只改 bindings.lint。

bindings:
  lint: markdownlint

composition:
  needs:
    - capability: skill:doc_review
      requires: [doc:lint, knowledge:review_rubric, prompt:reader_brief]
      bind: doc-review

resources:
  - id: markdownlint
    type: mcp
    slot: lint
    source: npm:@dougis/markdown-lint-mcp@1.0.5
    transport: stdio
    config:
      command: npx
      args: ["-y", "@dougis/markdown-lint-mcp@1.0.5"]
    provides: [doc:lint]

  - id: review-rubric
    type: knowledge
    source: ./resources/review-rubric.md
    provides: [knowledge:review_rubric]

  - id: reader-brief
    type: prompt
    source: ./resources/reader-brief.md
    provides: [prompt:reader_brief]

  - id: doc-review
    type: skill
    source: ./skills/doc-review
    needs: [doc:lint, knowledge:review_rubric, prompt:reader_brief]
    dependsOn: [markdownlint, review-rubric, reader-brief]
    provides: [skill:doc_review]

verify:
  - type: file-exists
    path: "${target.skillsDir}/doc-review/SKILL.md"

  - type: file-exists
    path: "${target.skillsDir}/doc-review/scripts/check-structure.mjs"

  - type: file-exists
    path: "${target.skillsDir}/doc-review/scripts/check-links.mjs"

  - type: file-exists
    path: "${target.knowledgeDir}/review-rubric.md"

  - type: file-exists
    path: "${target.promptsDir}/reader-brief.md"

  - type: config-key
    path: "${target.configFile}"
    key: "mcpServers.markdownlint.command"
    equals: npx

  - type: command
    run: ["node", "${target.skillsDir}/doc-review/scripts/check-structure.mjs", "--self-test"]

  - type: command
    run: ["node", "${target.skillsDir}/doc-review/scripts/check-links.mjs", "--self-test"]
