apiVersion: packhub.dev/v0
kind: Pack

metadata:
  name: lvlc233/learning-system
  version: 0.1.0
  title: 学习系统：把材料读成下次能用的认识
  description: 两个 skill（学习、记忆）加一份加载器说明。只打框架，不打记忆区里攒下的内容——那是本机的东西，换台机器应该是空的。
  targets: [dir]
  visibility: private

requires:
  packhub: ">=0.0.1 <0.1"

resources:
  - id: learn-core
    type: skill
    source: ./skills/learn-core

  - id: memory-core
    type: skill
    source: ./forks/memory-core # 上游那份写死了打包机器的绝对路径，这份改成随包走

  - id: loader-notes
    type: knowledge
    source: ./resources/loader.md

# 二次修改：按资源定位到一行 / 一段 / 整份文件
modify:
  - resource: learn-core
    file: SKILL.md
    at: '本机的配置在 `G:\work\tool\skill-hub\learning\config.md`；下面写的 `config.md:xxx` 都指那一份里的键。读完它再看这一段，不然位置全靠猜。'
    with: '本机的配置在 `config.md`（随包走，和 SKILL.md 同级目录）；下面写的 `config.md:xxx` 都指那一份里的键。读完它再看这一段，不然位置全靠猜。'

verify:
  - type: file-exists
    path: "${target.skillsDir}/learn-core/SKILL.md"

  - type: file-exists
    path: "${target.skillsDir}/memory-core/SKILL.md"

  - type: file-exists
    path: "${target.knowledgeDir}/loader.md"
