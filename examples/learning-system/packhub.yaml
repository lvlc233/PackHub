apiVersion: packhub.dev/v0
kind: Pack

metadata:
  name: lvlc233/learning-system
  version: 0.1.0
  title: 学习系统：把材料读成下次能用的认识
  description: 两个 skill（学习、记忆）加一份加载器说明。只打框架，不打记忆区里攒下的内容——那是本机的东西，换台机器应该是空的。
  targets: [dir]
  visibility: private

requires:
  packhub: ">=0.0.1 <0.1"

resources:
  - id: learn-core
    type: skill
    source: ./skills/learn-core

  - id: memory-core
    type: skill
    source: ./skills/memory-core

  - id: loader-notes
    type: knowledge
    source: ./resources/loader.md

overrides:
  # 上游那份 memory-core 里写死了打包机器的绝对路径；换成改过的一份，随包走
  - resource: memory-core
    source: ./forks/memory-core

overlays:
  # 装完之后再把 learn-core 的 SKILL.md 盖一遍：改掉同一处绝对路径
  - from: ./overlays/learn-core
    to: .packhub/skills/learn-core
    include: [SKILL.md]

verify:
  - type: file-exists
    path: "${target.skillsDir}/learn-core/SKILL.md"

  - type: file-exists
    path: "${target.skillsDir}/memory-core/SKILL.md"

  - type: file-exists
    path: "${target.knowledgeDir}/loader.md"
