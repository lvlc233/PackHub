<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAL</title>
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
  <header class="toolbar">
    <div class="brand">
      <span class="brand-name">PAL</span>
      <span class="brand-rule"></span>
      <span class="brand-sub">实例启动器</span>
    </div>
    <label class="harness-switch" title="切换 harness">
      <select id="harness-switch" aria-label="切换 harness"></select>
    </label>
    <div class="toolbar-grow"></div>
    <button class="btn" id="add-pack" type="button"><span class="ico" data-icon="folder-plus"></span>添加整合包</button>
    <button class="btn icon" id="refresh" type="button" title="刷新 (F5)" aria-label="刷新"><span class="ico" data-icon="refresh"></span></button>
    <button class="btn icon" id="about" type="button" title="关于与快捷键" aria-label="关于与快捷键"><span class="ico" data-icon="info"></span></button>
  </header>

  <div class="work">
    <aside class="rail">
      <div class="rail-head">
        <div class="rail-title">Harness<span class="rail-count" id="count">0</span></div>
        <button class="filter-btn hidden" id="filter-btn" type="button" aria-haspopup="menu" aria-expanded="false">
          <span id="filter-label">全部</span><span class="ico" data-icon="chevron-down"></span>
        </button>
        <div class="menu hidden" id="filter-menu" role="menu"></div>
      </div>
      <div class="rail-list" id="home-list" role="listbox" aria-label="Harness"></div>
      <div class="rail-empty hidden" id="empty">
        <p class="re-title">这个宿主下没有实例</p>
        <p class="re-body"></p>
      </div>
    </aside>

    <section class="pane">
      <div class="pane-head hidden" id="pane-head"></div>
      <div class="tabs hidden" id="tabs" role="tablist" aria-label="实例详情"></div>
      <div class="pane-body" id="pane-body" role="tabpanel"></div>
      <div class="panel hidden" id="panel">
        <div class="panel-bar" id="panel-bar"></div>
        <div class="panel-body" id="panel-body">
          <div class="panel-idle" id="panel-idle"></div>
          <div class="term-host" id="term"></div>
        </div>
      </div>
    </section>
  </div>

  <footer class="statusbar">
    <span class="sb-item" id="sb-count"></span>
    <span class="sb-item" id="sb-filter"></span>
    <div class="sb-grow"></div>
    <span class="sb-item kb"><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
    <span class="sb-item kb"><kbd>↵</kbd> 启动</span>
    <span class="sb-item kb"><kbd>F5</kbd> 刷新</span>
    <span class="sb-item kb"><kbd>Esc</kbd> 关闭</span>
  </footer>
</div>
<div class="toasts" id="toasts"></div>
<div class="popover hidden" id="popover" role="menu"></div>
<div class="modal-root hidden" id="modal-root"></div>
<script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="./renderer.js"></script>
</body>
</html>
