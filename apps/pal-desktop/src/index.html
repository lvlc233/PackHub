<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAL</title>
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="mark">P</div><b>PAL</b><span>启动器</span></div>
    <div class="filters" id="filters"></div>
    <div class="top-actions">
      <button class="btn" id="add-pack" type="button">+ 添加整合包</button>
      <button class="icon-btn" id="refresh" type="button" title="刷新">↻</button>
    </div>
  </header>

  <div class="body">
    <section class="list-pane">
      <div class="list-head"><span>实例</span><span id="count"></span></div>
      <div id="home-list" class="home-list"></div>
      <div id="empty" class="empty hidden">
        <div class="big">+</div>
        <h3>还没有实例</h3>
        <p>添加一个整合包，PAL 会为它建一个 home；之后这里就是可启动的实例列表。</p>
        <button class="btn primary" id="empty-add" type="button">添加整合包</button>
      </div>
    </section>

    <aside class="launch-pane">
      <div id="launch"></div>
    </aside>
  </div>

  <div id="view-term" class="term-overlay hidden">
    <div class="term-head">
      <div><b id="term-title">终端</b><span id="term-sub"></span></div>
      <div class="term-actions"><button class="btn" id="term-hide" type="button">返回</button><button class="btn danger" id="term-kill" type="button">结束</button></div>
    </div>
    <div class="term-wrap" id="term"></div>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="./renderer.js"></script>
</body>
</html>
