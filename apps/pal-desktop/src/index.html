<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAL</title>
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
  <header class="toolbar">
    <div class="brand">
      <span class="brand-name">PAL</span>
      <span class="brand-rule"></span>
      <span class="brand-sub">实例启动器</span>
    </div>
    <div class="toolbar-grow"></div>
    <button class="btn" id="add-pack" type="button"><span class="ico" data-icon="folder-plus"></span>添加整合包</button>
    <button class="btn icon" id="refresh" type="button" title="刷新 (F5)" aria-label="刷新"><span class="ico" data-icon="refresh"></span></button>
  </header>

  <div class="work">
    <aside class="rail">
      <div class="rail-head">
        <div class="rail-title">实例<span class="rail-count" id="count">0</span></div>
        <button class="filter-btn" id="filter-btn" type="button" aria-haspopup="menu" aria-expanded="false">
          <span id="filter-label">全部</span><span class="ico" data-icon="chevron-down"></span>
        </button>
        <div class="menu hidden" id="filter-menu" role="menu"></div>
      </div>
      <div class="rail-list" id="home-list" role="listbox" aria-label="实例"></div>
      <div class="rail-empty hidden" id="empty">
        <p class="re-title">这个宿主下没有实例</p>
        <p class="re-body"></p>
      </div>
    </aside>

    <section class="pane">
      <div class="pane-head" id="pane-head"></div>
      <div class="pane-body" id="pane-body"></div>
      <div class="panel" id="panel">
        <div class="panel-bar">
          <span class="panel-title">终端</span>
          <span class="panel-state" id="panel-state"></span>
          <div class="panel-grow"></div>
          <div class="panel-actions">
            <button class="pbtn" id="panel-kill" type="button"><span class="ico" data-icon="stop"></span>结束</button>
            <button class="pbtn" id="panel-toggle" type="button" title="展开 / 收起"><span class="ico" data-icon="expand"></span><span class="pt-label">展开</span></button>
          </div>
        </div>
        <div class="panel-body">
          <div class="panel-idle" id="panel-idle"></div>
          <div class="term-host" id="term"></div>
        </div>
      </div>
    </section>
  </div>

  <footer class="statusbar">
    <span class="sb-item" id="sb-count"></span>
    <span class="sb-item" id="sb-filter"></span>
    <div class="sb-grow"></div>
    <span class="sb-item kb"><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
    <span class="sb-item kb"><kbd>↵</kbd> 启动</span>
    <span class="sb-item kb"><kbd>F5</kbd> 刷新</span>
  </footer>
</div>
<div class="toasts" id="toasts"></div>
<script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="./renderer.js"></script>
</body>
</html>
