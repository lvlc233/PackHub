<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAL</title>
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
  <header class="toolbar">
    <div class="brand">
      <span class="brand-name">PAL</span>
      <span class="brand-rule"></span>
      <span class="brand-sub">实例启动器</span>
    </div>
    <label class="harness-switch" title="当前 harness（只列已安装的）">
      <select id="harness-switch" aria-label="当前 harness"></select>
    </label>
    <nav class="nav" id="nav" aria-label="主导航"></nav>
    <div class="toolbar-grow"></div>
    <button class="btn" id="add-pack" type="button"><span class="ico" data-icon="folder-plus"></span>添加整合包</button>
    <button class="btn icon" id="refresh" type="button" title="刷新 (F5)" aria-label="刷新"><span class="ico" data-icon="refresh"></span></button>
    <button class="btn icon" id="about" type="button" title="关于与快捷键" aria-label="关于与快捷键"><span class="ico" data-icon="info"></span></button>
  </header>

  <main class="work">
    <section class="view" id="view-launch" aria-label="启动">
      <div class="pane-head" id="launch-head"></div>
      <div class="tabbar">
        <div class="tabs" id="launch-tabs" role="tablist" aria-label="当前整合包"></div>
        <div class="tabbar-end" id="launch-switch"></div>
      </div>
      <div class="pane-body" id="launch-body" role="tabpanel"></div>
      <footer class="tab-foot" id="launch-foot"></footer>
      <div class="panel hidden" id="panel">
        <div class="panel-bar" id="panel-bar"></div>
        <div class="panel-body" id="panel-body">
          <div class="panel-idle" id="panel-idle"></div>
          <div class="term-host" id="term"></div>
        </div>
      </div>
    </section>

    <section class="view hidden" id="view-library" aria-label="整合包">
      <div class="view-head" id="lib-head"></div>
      <div class="view-scroll" id="lib-scroll"></div>
      <footer class="tab-foot" id="lib-foot"></footer>
    </section>

    <section class="view hidden" id="view-settings" aria-label="设置">
      <div class="view-head" id="set-head"></div>
      <div class="view-scroll" id="set-scroll"></div>
      <footer class="tab-foot" id="set-foot"></footer>
    </section>
  </main>

  <footer class="statusbar">
    <span class="sb-item" id="sb-harness"></span>
    <span class="sb-item" id="sb-live"></span>
    <div class="sb-grow"></div>
    <span class="sb-keys" id="sb-keys"></span>
  </footer>
</div>
<div class="toasts" id="toasts"></div>
<div class="popover hidden" id="popover" role="menu"></div>
<div class="modal-root hidden" id="modal-root"></div>
<script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="./renderer.js"></script>
</body>
</html>
